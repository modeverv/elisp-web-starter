# nginx in front of this application: goes into the http { } block (on
# Debian and Ubuntu: a file in /etc/nginx/conf.d/).  nginx does HTTPS and
# compression; Emacs, on the same machine, does the rest.  (The browser's
# Emacs in vendor/ arrives compressed from Emacs: fetch-emacs.sh keeps .gz
# copies, which nginx passes on as they are.)  Replace example.com and the
# certificate paths, then:
#
#   PUBLIC_ORIGIN=https://example.com WORKERS=4 PROXY_SENDS_FILES=yes ./run.sh

# Four Emacs processes (WORKERS=4 ./run.sh, on 8018 to 8021): one Emacs uses
# one core and does one thing at a time.  With WORKERS=1, leave the first.
# (max_fails=0: the four are one application on one machine.  Left to
# itself, nginx stops asking a process for ten seconds after one connection
# to it failed, which a burst of visitors brings about, and with all four
# set aside it answers 502.)
upstream emacs_application {
    least_conn;
    server 127.0.0.1:8018 max_fails=0;
    server 127.0.0.1:8019 max_fails=0;
    server 127.0.0.1:8020 max_fails=0;
    server 127.0.0.1:8021 max_fails=0;
    keepalive 16;                       # connections to Emacs that stay open
}

# How many requests one address may have under way at a time (below).
limit_conn_zone $binary_remote_addr zone=per_address:10m;

server {
    listen 443 ssl;
    server_name example.com;
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    # The largest request body.  1m is what the application takes as text;
    # if server.el takes files (app-server-upload-p), the largest of those.
    client_max_body_size 1m;
    # With uploads: pass a file on as it arrives instead of storing it first.
    # proxy_request_buffering off;
    # Browsers that were here once come back over HTTPS only.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    # One address, at most this many requests at a time; the next one gets
    # 503.  A browser that opens the application for the first time has
    # some twenty requests under way, and a school or an office is one
    # address: with 200 here, half of a hundred visitors who arrived
    # together from one address were turned away.  Lower it only for an
    # application whose visitors come one by one.  (nginx itself takes
    # worker_connections per worker process, 768 or 1024 as installed.)
    limit_conn per_address 600;
    gzip on;
    gzip_types text/plain text/css text/javascript application/json application/x-emacs-lisp application/wasm;

    # The browser's Emacs, if ./fetch-emacs.sh put it into vendor/: nginx
    # sends those files itself (root is the application's directory).  They
    # are what every new visitor downloads, 5 MB each, and Emacs sends one
    # file at a time: twenty to thirty visitors arriving in the same second
    # are what it manages, and nginx has no such limit.  It sends the .gz
    # copies (gzip_static) and the parts of a file that the page asks for.
    location /vendor/ {
        root /srv/app;
        gzip_static on;
    }

    # With PROXY_SENDS_FILES=yes, Emacs decides whether a file may be sent
    # and to whom, and names it in an X-Accel-Redirect header; nginx sends
    # it from here: any other file of the application, and the files its
    # server.el answers with.  Visitors on slow connections, or who do not
    # read, then wait at nginx and not inside Emacs.  Nobody reaches this
    # from outside ("internal"); alias is the application's directory.
    location /.files/ {
        internal;
        alias /srv/app/;
        gzip_static on;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
    # What server.el answers with lies in .data/: those files are for the
    # application's own pages, as its other answers are.  (Of the headers
    # server.el set, nginx passes on the type, the name to save under,
    # Cache-Control and cookies.)
    location /.files/.data/ {
        internal;
        alias /srv/app/.data/;
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location / {
        proxy_pass http://emacs_application;
        proxy_http_version 1.1;         # with the next line: keep the connection open
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # The visitor's address as nginx saw it, not what the visitor claims.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;         # longer than a deferred answer may take (30 s)
    }
}

server {
    listen 80;
    server_name example.com;
    return 301 https://$host$request_uri;
}
